name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Create app if missing
        run: |
          app="$(awk -F"'" '/^app = /{print $2}' fly.toml)"
          test -n "$app"
          if ! flyctl status --app "$app" >/dev/null 2>&1; then
            flyctl apps create "$app" --org personal
          fi

      - name: Stage runtime secrets
        env:
          WANDERLOG_COOKIE: ${{ secrets.WANDERLOG_COOKIE }}
          MCP_ACCESS_KEY: ${{ secrets.MCP_ACCESS_KEY }}
        run: |
          test -n "$WANDERLOG_COOKIE"
          test "${#MCP_ACCESS_KEY}" -ge 32
          printf 'WANDERLOG_COOKIE=%s\nMCP_ACCESS_KEY=%s\n' "$WANDERLOG_COOKIE" "$MCP_ACCESS_KEY" \
            | flyctl secrets import --stage

      - run: flyctl deploy --remote-only --ha=false
